<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat System</title>
    <script src="https://cdn.socket.io/4.3.2/socket.io.min.js"></script>
</head>
<body>
    <h2>Real-Time Chat</h2>
    <div>
        <input type="text" id="investorId" placeholder="Enter Investor ID">
        <input type="text" id="startupId" placeholder="Enter Startup ID">
        <button onclick="startChat()">Start Chat</button>
    </div>
    
    <div id="chatBox" style="display:none;">
        <h3>Chat Room</h3>
        <div id="messages"></div>
        <input type="text" id="messageInput" placeholder="Type a message">
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        const socket = io("http://localhost:3000");
        let chatId = "";

        function startChat() {
            const investorId = document.getElementById("investorId").value;
            const startupId = document.getElementById("startupId").value;

            if (!investorId || !startupId) {
                alert("Both IDs are required!");
                return;
            }

            chatId = `${investorId}_${startupId}`;
            socket.emit("startChat", { investorId, startupId });

            document.getElementById("chatBox").style.display = "block";
        }

        socket.on("chatStarted", (data) => {
            chatId = data.chatId;
            console.log("Chat started:", chatId);
        });

        function sendMessage() {
            const message = document.getElementById("messageInput").value;
            socket.emit("sendMessage", { chatId, sender: "Investor", message });

            document.getElementById("messages").innerHTML += `<p><b>Me:</b> ${message}</p>`;
            document.getElementById("messageInput").value = "";
        }

        socket.on("receiveMessage", (data) => {
            document.getElementById("messages").innerHTML += `<p><b>${data.sender}:</b> ${data.message}</p>`;
        });
    </script>
</body>
</html>
